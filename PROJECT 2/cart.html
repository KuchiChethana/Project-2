<!DOCTYPE html>
<html>

<head>

    <title>Cart | FoodVerse</title>

    <style>

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #d9e4ec);
            margin: 0;
            text-align: center;
        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.9);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        .menu a:hover {
            color: orange;
        }

        h1 {
            margin-top: 30px;
            color: #333;
        }

        .table-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            padding: 0 15px;
        }

        table {
            border-collapse: collapse;
            width: 85%;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: orange;
            color: white;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .cart-image {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
        }

        .quantity-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .quantity-control button {
            padding: 5px 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .quantity-control button:hover {
            background: orange;
        }

        .remove-btn {
            padding: 7px 12px;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #total {
            color: #333;
        }

        .coupon-box {
            width: 50%;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .coupon-box input {
            padding: 10px;
            width: 55%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .coupon-box button {
            padding: 10px 18px;
            background: orange;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #couponMessage {
            font-weight: bold;
        }

        .order-summary {
            width: 50%;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: left;
        }

        .order-summary h2 {
            text-align: center;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .grand-total {
            font-size: 22px;
            font-weight: bold;
            color: orange;
        }

        .empty-cart {
            padding: 45px 20px;
        }

        .empty-icon {
            font-size: 65px;
        }

        .shop-btn,
        .order-btn,
        .clear-btn {
            margin: 10px;
            padding: 12px 25px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .shop-btn,
        .order-btn {
            background: orange;
        }

        .clear-btn {
            background: #555;
        }

        @media(max-width:768px) {

            .top-bar {
                flex-direction: column;
            }

            .menu a {
                display: inline-block;
                margin: 5px;
            }

            table {
                width: 100%;
            }

            .order-summary,
            .coupon-box {
                width: 85%;
            }

        }

    </style>

</head>

<body>

    <div class="top-bar">

        <div class="logo">
            FoodVerse
        </div>

        <div class="menu">

            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="tiffins.html">Tiffins</a>
            <a href="vegstarters.html">Veg Starters</a>
            <a href="vegbiriyani.html">Veg Biriyanis</a>
            <a href="nonvegbiriyani.html">Non-Veg Biriyanis</a>
            <a href="desserts.html">Desserts</a>
            <a href="aboutus.html">About Us</a>
            <a href="contact.html">Contact</a>

            <a href="cart.html">
                Cart 🛒 (<span id="cartCount">0</span>)
            </a>

        </div>

    </div>


    <h1>Your Cart 🛒</h1>


    <div class="table-container">

        <table id="cartTable"></table>

    </div>


    <h2 id="total">
        Items Total: ₹0
    </h2>


    <div class="coupon-box">

        <h3>Have a Coupon? 🎁</h3>

        <input
            type="text"
            id="couponInput"
            placeholder="Enter coupon code">

        <button onclick="applyCoupon()">
            Apply
        </button>

        <p id="couponMessage"></p>

    </div>


    <div class="order-summary">

        <h2>Order Summary</h2>

        <div class="summary-row">
            <span>Items Total</span>
            <span id="itemsTotal">₹0</span>
        </div>

        <div class="summary-row">
            <span>Delivery Fee</span>
            <span id="deliveryFee">₹0</span>
        </div>

        <div class="summary-row">
            <span>Discount</span>
            <span id="discountAmount">₹0</span>
        </div>

        <div class="summary-row grand-total">
            <span>Grand Total</span>
            <span id="grandTotal">₹0</span>
        </div>

    </div>


    <button
        class="shop-btn"
        onclick="continueShopping()">

        Continue Shopping

    </button>


    <button
        class="order-btn"
        onclick="placeOrder()">

        Place Order

    </button>


    <button
        class="clear-btn"
        onclick="clearCart()">

        Clear Cart

    </button>


    <script src="cart.js"></script>

</body>

</html>
