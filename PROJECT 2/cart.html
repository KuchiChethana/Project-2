<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart | FoodVerse</title>

    <style>

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #d9e4ec);
            margin: 0;
            text-align: center;
            color: #333;
        }

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .logo:hover {
            color: orange;
            transform: scale(1.1);
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            padding: 6px 0;
            transition: 0.3s;
        }

        .menu a:hover {
            color: orange;
        }

        h1 {
            margin-top: 30px;
            color: #333;
        }

        /* Contribution #7 */
        #cartItemSummary {
            color: #777;
            font-size: 17px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .table-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            padding: 0 15px;
        }

        table {
            border-collapse: collapse;
            width: 75%;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: orange;
            color: white;
            font-size: 16px;
        }

        th,
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9f9f9;
        }

        #total {
            margin-top: 25px;
            font-size: 22px;
            color: #333;
            font-weight: bold;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background: orange;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .quantity-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .quantity-control button {
            margin: 0;
            padding: 5px 12px;
            font-size: 18px;
        }

        .quantity {
            font-size: 17px;
            font-weight: bold;
        }

        .remove-btn {
            background: #e74c3c;
            margin: 0;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .empty {
            margin-top: 20px;
            font-size: 18px;
            color: #777;
        }

        .cart-actions {
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .clear-btn {
            background: #555;
            margin-left: 10px;
        }

        .continue-btn {
            background: #27ae60;
            margin-left: 10px;
        }

        .order-btn {
            background: darkorange;
        }

        @media (max-width: 900px) {

            .top-bar {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }

            .menu a {
                display: inline-block;
                margin: 5px 8px;
            }

            table {
                width: 95%;
            }
        }

        @media (max-width: 600px) {

            th,
            td {
                padding: 8px;
                font-size: 13px;
            }

            .quantity-control {
                gap: 4px;
            }

            .quantity-control button {
                padding: 4px 8px;
            }
        }

    </style>
</head>

<body>

    <div class="top-bar">

        <div class="logo">
            FoodVerse
        </div>

        <div class="menu">

            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="tiffins.html">Tiffins</a>
            <a href="vegstarters.html">Veg Starters</a>
            <a href="vegbiriyani.html">Veg Biriyanis</a>
            <a href="nonvegbiriyani.html">Non-Veg Biriyanis</a>
            <a href="desserts.html">Desserts</a>
            <a href="aboutus.html">About Us</a>
            <a href="contact.html">Contact</a>

            <a href="cart.html">
                Cart 🛒 (<span id="cartCount">0</span>)
            </a>

        </div>

    </div>


    <h1>
        Your Cart 🛒
    </h1>


    <!-- Contribution #7 -->
    <p id="cartItemSummary">
        0 items in your cart
    </p>


    <div class="table-container">

        <table id="cartTable">

            <tr>

                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Action</th>

            </tr>

        </table>

    </div>


    <h2 id="total">
        Total: ₹0
    </h2>


    <div class="cart-actions">

        <button
            class="order-btn"
            onclick="placeOrder()">
            Place Order
        </button>

        <button
            class="clear-btn"
            onclick="clearCart()">
            Clear Cart
        </button>

        <button
            class="continue-btn"
            onclick="continueShopping()">
            Continue Shopping
        </button>

    </div>


    <script src="cart.js"></script>

</body>

</html>
